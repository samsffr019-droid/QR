<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>QR</title>
<style>
  :root { color-scheme: light; }
  body { background:#fff; color:#000; text-align:center; font-family:sans-serif; }
  #qr { display:inline-block; background:#fff; padding:16px; margin-top:20px; }
</style>
</head>
<body>
<h3>ساخت QR</h3>
<input id="t" placeholder="متن یا لینک" style="width:80%;padding:10px">
<br><br>
<button onclick="make()" style="padding:10px 20px">بساز</button>
<br>
<div id="qr"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
function make(){
  var box = document.getElementById("qr");
  box.innerHTML = "";
  new QRCode(box, {text: document.getElementById("t").value, width: 256, height: 256, colorDark:"#000000", colorLight:"#ffffff"});
}
</script>
</body>
</html>
